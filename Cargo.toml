[package]
name = "bingo_texture_gen"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9" }
image = "0.25.10"
photon-rs = "0.3.3"
serde = { version = "1.0.228", features = ["derive"] }
